[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livevsr"
version = "0.3.3"
description = "Audio-conditioned face-video restoration with GPEN references"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6", "torchvision>=0.21", "numpy>=1.24,<3", "Pillow>=10",
  "einops>=0.8", "safetensors>=0.4", "transformers>=4.48,<6",
  "huggingface_hub>=0.28", "tqdm>=4.66", "typing_extensions>=4.10",
  "opencv-python>=4.8", "scipy>=1.10", "scikit-image>=0.21"
]

[project.optional-dependencies]
reference = ["opencv-python>=4.8", "scipy>=1.10", "ninja>=1.11"]
scene = ["opencv-python>=4.8", "scipy>=1.10", "scikit-image>=0.21"]

[project.scripts]
livevsr = "livevsr.cli:main"

[tool.setuptools.packages.find]
include = ["livevsr*"]

[tool.setuptools.package-data]
livevsr = ["model_sources.json", "assets/paste_face_mask.png"]
